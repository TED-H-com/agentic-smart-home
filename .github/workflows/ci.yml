name: Agentic Smart Home
'on': [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Locked dependencies and UI
        run: |
          python -m pip install uv==0.11.20
          uv sync --frozen
          npm ci --prefix web
          npm run build --prefix web
          uv run python -c "import sys; sys.path.insert(0,'scripts'); from package import package_runner, package_bridge, package_notifications; package_runner(); package_bridge(); package_notifications()"
          uv run playwright install --with-deps chromium
      - name: Source and contract checks
        run: |
          uv run ruff check controller runner hermes bridge custom_components host scripts tests
          uv run python scripts/contracts.py --check
          uv run python scripts/web_toolchain.py --check
          uv run python scripts/validate_kit.py
      - name: Controller source bundle
        run: uv run python scripts/controller_source.py
      - name: Pinned Hermes archive identity
        id: hermes-archive
        run: |
          hermes_archive_sha=$(python3 hermes/fetch_upstream.py --print-sha256)
          echo "sha256=$hermes_archive_sha" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Hermes archive
        id: hermes-source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: hermes/.upstream-cache/${{ steps.hermes-archive.outputs.sha256 }}.tar.gz
          key: hermes-source-v1-${{ steps.hermes-archive.outputs.sha256 }}
      - name: Verify or fetch pinned Hermes archive
        run: python3 hermes/fetch_upstream.py --cache-dir hermes/.upstream-cache --download-only
      - name: Save verified Hermes archive
        if: steps.hermes-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: hermes/.upstream-cache/${{ steps.hermes-archive.outputs.sha256 }}.tar.gz
          key: hermes-source-v1-${{ steps.hermes-archive.outputs.sha256 }}
      - name: Set up Hermes image cache builder
        id: hermes-builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          use: false
      - name: Build Hermes with verified source and reusable layers
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          builder: ${{ steps.hermes-builder.outputs.name }}
          context: ./hermes
          load: true
          tags: agentic-home-hermes:0.11.1
          cache-from: type=gha,scope=agentic-home-hermes-linux-amd64
          cache-to: type=gha,mode=max,scope=agentic-home-hermes-linux-amd64,ignore-error=true
      - name: Build installable App images
        run: |
          uv run python -c "import sys; sys.path.insert(0,'scripts'); from package import package_runner; package_runner()"
          docker build -t agentic-home-controller:0.11.1 controller
          docker build -t agentic-home-runner:0.11.1 runner
          docker build -t agentic-home-linejs:0.11.1 host/linejs
          docker build -t agentic-home-preview:0.11.1 host/preview
          docker build -t agentic-home-bridge:0.11.1 bridge
          docker pull ghcr.io/home-assistant/amd64-hassio-supervisor:2026.09.3
      - name: Real Core, CLI containers and browser tests
        run: |
          mkdir -p "$HOME/agent-work/tmp/pytest"
          agentic_ci_tmp=$(mktemp -d "$HOME/agent-work/tmp/pytest/agentic-home-XXXXXX")
          trap 'rm -rf -- "$agentic_ci_tmp"' EXIT
          uv run pytest -q --basetemp "$agentic_ci_tmp" --real-ha --containers --junitxml=evidence/pytest.xml
      - name: Package
        run: |
          python3 scripts/build_host.py
          uv run python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentic-home-0.11.1
          retention-days: 7
          path: |
            dist/agentic-home-0.11.1-source.zip
            controller/static/downloads/agentic-home-notifications.zip
            evidence/

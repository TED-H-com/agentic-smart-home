name: Butler mainline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shell syntax
        run: find deploy scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: No secrets in tree
        run: bash scripts/check-no-secrets.sh
      - name: Required layout
        run: bash scripts/check-layout.sh

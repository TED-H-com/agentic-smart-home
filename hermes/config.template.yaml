# Minimal Hermes config for the butler VM. Copy to the guest
# (for example /home/hermes/.hermes/config.yaml) and keep secrets off git.
# api_key below is a local placeholder for the loopback shim; it is not a cloud credential.

model:
  default: "gemini-3.8-flash"
  provider: "custom"
  base_url: "http://127.0.0.1:18795/v1"
  api_key: "local-shim"

# Official Home Assistant MCP. Leave disabled until a test HA (not VM 100) is ready.
# Fill url on the guest only. Auth is OAuth in the official integration; do not put tokens here.
mcp_servers: {}
# mcp_servers:
#   home-assistant-test:
#     url: "http://HAOS-TEST-IP/api/mcp/assist"
#     enabled: true

name: agentic-home
services:
  linejs:
    image: agentic-home-linejs:0.3.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/lib/agentic-home/linejs:/data
      - /var/lib/agentic-home/line-config:/config:ro
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 20s
  runner:
    image: agentic-home-runner:0.3.0
    hostname: localhost
    network_mode: host
    restart: unless-stopped
    environment:
      AGENTIC_HOST_MODE: "1"
    volumes:
      - /var/lib/agentic-home/runner:/data
      - /var/lib/agentic-home/pairing:/pairing
    mem_limit: 1536m
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health',timeout=3)"]
  controller:
    image: agentic-home-controller:0.3.0
    network_mode: host
    restart: unless-stopped
    environment:
      AGENTIC_HOST_MODE: "1"
      AGENTIC_HA_URL: http://192.168.177.2:80
    volumes:
      - /var/lib/agentic-home/controller:/data
      - /var/lib/agentic-home/pairing:/pairing:ro
      - /run/agentic-home:/run/agentic-home
      - /var/lib/agentic-home/line-config:/line-config
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 45s

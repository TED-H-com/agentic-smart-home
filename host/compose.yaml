name: agentic-home
services:
  hermes:
    image: ${AGENTIC_HERMES_IMAGE:-agentic-home-hermes:0.11.0}
    network_mode: host
    restart: unless-stopped
    read_only: true
    group_add: ["1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/lib/agentic-home/hermes:/data
      - /var/lib/agentic-home/hermes-link:/hermes-link:ro
    mem_limit: 768m
    pids_limit: 64
    cpus: 1.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  linejs:
    image: agentic-home-linejs:0.11.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/lib/agentic-home/linejs:/data
      - /var/lib/agentic-home/line-config:/config:ro
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 20s
  runner:
    image: agentic-home-runner:0.11.0
    hostname: localhost
    network_mode: host
    restart: unless-stopped
    environment:
      AGENTIC_HOST_MODE: "1"
      AGENTIC_DISABLED_PROVIDERS: "${AGENTIC_DISABLED_PROVIDERS:-}"
    volumes:
      - /var/lib/agentic-home/runner:/data
      - /var/lib/agentic-home/pairing:/pairing
      - /run/agentic-home:/run/agentic-home
    mem_limit: 1536m
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health',timeout=3)"]
  controller:
    image: ${AGENTIC_CONTROLLER_IMAGE:-agentic-home-controller:0.11.0}
    network_mode: host
    restart: unless-stopped
    environment:
      AGENTIC_HOST_MODE: "1"
      AGENTIC_HA_URL: http://192.168.177.2:80
      AGENTIC_HERMES_MCP: "1"
    volumes:
      - /var/lib/agentic-home/controller:/data
      - /var/lib/agentic-home/pairing:/pairing:ro
      - /run/agentic-home:/run/agentic-home
      - /var/lib/agentic-home/line-config:/line-config
      - /var/lib/agentic-home/hermes-link:/hermes-link:ro
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 45s

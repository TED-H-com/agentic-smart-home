[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-home"
version = "0.11.1"
description = "Home Assistant controller and isolated cloud agent runner"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiohttp>=3.11,<4",
  "pydantic>=2.10,<3", "cryptography>=50.0.2,<51",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.51,<2", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["controller", "runner", "bridge"]
include = ["agentic_controller*", "agentic_runner*", "agentic_bridge*"]

[tool.setuptools.package-data]
agentic_runner = ["codex-models.json", "CODEX-LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
testpaths = ["tests"]
pythonpath = ["controller", "runner", "hermes", "bridge"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
